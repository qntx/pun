[package]
name                   = "pun"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
readme                 = "../../README.md"
description            = "P2P pipe — NAT hole punching and blake3-verified transfer"
keywords               = ["p2p", "network", "holepunching", "cli"]
categories             = ["command-line-utilities", "network-programming"]

[[bin]]
name = "pun"
path = "src/main.rs"

[features]
default   = ["clipboard"]
clipboard = ["dep:crossterm"]

[dependencies]
anyhow             = "1.0.104"
clap               = { version = "4.6.6", features = ["derive"] }
console            = "0.16"
crossterm          = { version = "0.29.0", features = ["event-stream", "osc52"], optional = true }
data-encoding      = "2.11.1"
derive_more        = { version = "2.1.1", features = ["display", "from_str"] }
futures-buffered   = "0.2.13"
hex                = "0.4.3"
indicatif          = "0.18"
iroh               = "1.1.0"
iroh-blobs         = "0.103.0"
irpc               = "0.17.0"
n0-future          = "0.3"
num_cpus           = "1.17.0"
rand               = "0.10"
serde              = { version = "1", features = ["derive"] }
tokio              = { version = "1.53.1", features = ["full"] }
tracing            = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir            = "2.5.0"

[dev-dependencies]
duct     = "1.1"
tempfile = "3.27.0"

[lints]
workspace = true
